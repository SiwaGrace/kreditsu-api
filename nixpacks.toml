[phases.setup]
nixPkgs = [
    "php84",
    "php84Extensions.pdo",
    "php84Extensions.pdo_mysql",
    "php84Extensions.mbstring",
    "php84Extensions.xml",
    "php84Extensions.curl",
    "php84Extensions.zip",
    "composer"
]

[start]
cmd = "composer install --no-dev --optimize-autoloader && php artisan migrate --force && php -S 0.0.0.0:$PORT -t public"
```

---

**What does each part mean:**
```
php82                    → install PHP 8.2
php82Extensions.pdo      → lets PHP talk to databases
php82Extensions.pdo_mysql → specifically MySQL
php82Extensions.mbstring  → handles text/strings
php82Extensions.xml       → handles XML
php82Extensions.curl      → handles HTTP requests
php82Extensions.zip       → handles zip files
composer                  → installs your Laravel dependencies

php artisan migrate --force  → runs your migrations automatically on deploy
php artisan serve            → starts the Laravel server
--host=0.0.0.0               → makes it accessible from outside (Railway needs this)
--port=$PORT                 → Railway tells your app which port to use